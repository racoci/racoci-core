name: Deploy Holds Substrate UI to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'ui/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Install Dependencies
        working-directory: ui
        run: npm ci

      - name: Compile and Build Static Bundle
        working-directory: ui
        run: npm run build

      - name: Deploy Compiled static assets to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ui/dist # directory containing compiled index.html and assets
          branch: gh-pages # target deployment branch
          clean: true
